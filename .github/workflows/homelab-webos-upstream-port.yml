name: Home Lab webOS Upstream Port Staging

on:
  push:
    branches:
      - homelab/webos-discovery-v2
    paths:
      - '.github/workflows/homelab-webos-upstream-port.yml'

permissions:
  contents: write

concurrency:
  group: homelab-webos-upstream-port-staging
  cancel-in-progress: false

jobs:
  stage-reviewed-port:
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_TAG: '2.8.2'
      EXPECTED_RELEASE_SHA: 'ed327948aeb8ef19098b810145ab6a3b76ccf372'
      TARGET_BRANCH: 'update/webos-2.8.2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify stable release and untouched target branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/Moonfin-Client/Smart-TV/releases/latest --jq '.tag_name')"
          if [ "$tag" != "$EXPECTED_RELEASE_TAG" ]; then
            echo "Latest stable release changed from reviewed $EXPECTED_RELEASE_TAG to $tag; stop for a fresh impact review." >&2
            exit 1
          fi
          git remote remove official >/dev/null 2>&1 || true
          git remote add official https://github.com/Moonfin-Client/Smart-TV.git
          git fetch --no-tags official "refs/tags/${tag}:refs/homelab-upstream/tv/reviewed"
          release_sha="$(git rev-parse 'refs/homelab-upstream/tv/reviewed^{commit}')"
          if [ "$release_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Reviewed release SHA changed: $release_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          target_sha="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          if [ "$target_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Target branch has moved from the untouched release base ($target_sha); refusing to overwrite it." >&2
            exit 1
          fi

      - name: Merge overlay and apply reviewed five-file resolution
        shell: bash
        run: |
          set -euo pipefail
          overlay_sha="$GITHUB_SHA"
          git config user.name 'Home Lab CI'
          git config user.email 'homelab-ci@example.invalid'
          git checkout --detach "$EXPECTED_RELEASE_SHA"
          git merge --no-commit --no-ff "$overlay_sha" || true

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          expected=(
            packages/app/src/context/SettingsContext.js
            packages/app/src/utils/homeLayout.js
            packages/app/src/utils/homeLayout.test.js
            packages/app/src/utils/seerrTarget.js
            packages/app/src/utils/seerrTarget.test.js
          )
          if [ "${conflicts[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected conflict set:\n' >&2
            printf '  %s\n' "${conflicts[@]}" >&2
            exit 1
          fi

          git checkout --ours -- "${expected[@]}"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one reviewed anchor, found {count}')
              return text.replace(old, new, 1)

          p = Path('packages/app/src/context/SettingsContext.js')
          s = p.read_text()
          s = replace_once(s,
              "\tTV_TO_SERVER_ROW,\n\thasSeenServerLayout,",
              "\tTV_TO_SERVER_ROW,\n\tcustomHomeRowsFromProfile,\n\thasSeenServerLayout,",
              'Settings import')
          s = replace_once(s,
              "\t'personalRatingStyle', 'recentlyReleasedSeriesType', 'mergeRecentRowsByType', 'playlistsGroupByType',\n\t'useDetailedSubHeadings'",
              "\t'personalRatingStyle', 'recentlyReleasedSeriesType', 'mergeRecentRowsByType', 'playlistsGroupByType',\n"
              "\t// Derived from pluginDynamic homeSections. It is pulled for Home/destination hubs,\n"
              "\t// but homeSections remains authoritative and this field is never written standalone.\n"
              "\t'customHomeRows',\n\t'useDetailedSubHeadings'",
              'Settings custom rows key')
          s = replace_once(s,
              "\t\tif (key === 'homeRows') continue;\n\t\tif (wanted && !wanted.has(key)) continue;",
              "\t\tif (key === 'homeRows' || key === 'customHomeRows') continue;\n\t\tif (wanted && !wanted.has(key)) continue;",
              'Settings write suppression')
          s = replace_once(s,
              "\tif (homeRows !== undefined) {\n\t\tresolved.homeRows = homeRows;\n\t\tresolved.serverPluginSections = serverPluginSections();\n\t}\n\treturn resolved;",
              "\tif (homeRows !== undefined) {\n\t\tresolved.homeRows = homeRows;\n\t\tresolved.serverPluginSections = serverPluginSections();\n\t}\n\n"
              "\tconst customHomeRows = customHomeRowsFromProfile(envelope?.tv)\n"
              "\t\t?? customHomeRowsFromProfile(envelope?.global)\n"
              "\t\t?? customHomeRowsFromProfile(adminDefaults);\n"
              "\tif (customHomeRows !== undefined) resolved.customHomeRows = customHomeRows;\n"
              "\treturn resolved;",
              'Settings custom rows resolution')
          p.write_text(s)

          p = Path('packages/app/src/utils/homeLayout.js')
          s = p.read_text()
          anchor = "export const serverPluginSections = () =>\n\t(homeSectionsPassthrough || []).filter((section) => section && section.kind === 'pluginDynamic');"
          custom = r'''

          // Moonbase custom/editorial rows are pluginDynamic homeSections. Convert only the
          // custom server rows into the shape used by the Home-Lab external-row loader.
          export const customHomeRowsFromProfile = (serverProfile) => {
          	const sections = serverProfile?.homeSections;
          	if (!Array.isArray(sections)) return undefined;
          	const rows = sections.map((section) => {
          		if (!section || String(section.kind || '').toLowerCase() !== 'plugindynamic') return null;
          		if (String(section.serverId || '').toLowerCase() !== 'custom') return null;
          		let data = section.pluginAdditionalData;
          		if (typeof data === 'string') {
          			try { data = JSON.parse(data); } catch (error) { return null; }
          		}
          		if (!data || typeof data !== 'object' || !data.source || !data.type) return null;
          		return {
          			id: section.pluginSection || `custom-${section.order || 0}`,
          			name: section.pluginDisplayText || section.pluginSection || 'Custom',
          			enabled: section.enabled !== false,
          			order: section.order ?? 0,
          			source: data.source,
          			type: data.type,
          			params: data.params || {},
          			sortBy: data.sort_by || data.sortBy || 'none',
          			sortOrder: data.sort_order || data.sortOrder || 'desc',
          			showUserRatings: data.show_user_ratings ?? data.showUserRatings,
          			homelabDestinations: Array.isArray(data.homelab_destinations) ? data.homelab_destinations : [],
          			homelabDestinationOnly: data.homelab_destination_only === true
          		};
          	}).filter(Boolean);
          	return rows.length > 0 ? rows.sort((left, right) => left.order - right.order) : undefined;
          };'''
          custom = '\n'.join(line[10:] if line.startswith('          ') else line for line in custom.splitlines())
          s = replace_once(s, anchor, anchor + custom, 'homeLayout custom rows')
          p.write_text(s)

          p = Path('packages/app/src/utils/homeLayout.test.js')
          s = p.read_text()
          s = replace_once(s,
              "\t__resetHomeLayoutPassthrough,\n\tserverPluginSections,",
              "\t__resetHomeLayoutPassthrough,\n\tserverPluginSections,\n\tcustomHomeRowsFromProfile,",
              'homeLayout test import')
          block = r'''

          describe('customHomeRowsFromProfile', () => {
          	test('converts Moonbase pluginDynamic sections and keeps destination-only rows', () => {
          		const rows = customHomeRowsFromProfile({homeSections: [{
          			kind: 'pluginDynamic', type: 'none', enabled: false, order: 12, serverId: 'custom',
          			pluginSection: 'homelab_anime_fresh', pluginDisplayText: 'Fresh Discoveries',
          			pluginAdditionalData: JSON.stringify({source: 'tmdb_chart', type: 'discover/tv?with_genres=16', params: {}, homelab_destinations: ['anime'], homelab_destination_only: true})
          		}]});
          		expect(rows).toHaveLength(1);
          		expect(rows[0]).toMatchObject({id: 'homelab_anime_fresh', name: 'Fresh Discoveries', enabled: false, source: 'tmdb_chart', type: 'discover/tv?with_genres=16', homelabDestinations: ['anime'], homelabDestinationOnly: true});
          	});
          	test('ignores malformed and non-custom dynamic sections', () => {
          		expect(customHomeRowsFromProfile({homeSections: [
          			{kind: 'pluginDynamic', serverId: 'custom', pluginAdditionalData: '{bad'},
          			{kind: 'pluginDynamic', serverId: 'collections', pluginAdditionalData: '{}'}
          		]})).toBeUndefined();
          	});
          });
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          s = replace_once(s, "\ndescribe('writing the layout back', () => {", block + "\ndescribe('writing the layout back', () => {", 'homeLayout tests')
          p.write_text(s)

          p = Path('packages/app/src/utils/seerrTarget.js')
          s = p.read_text()
          s = replace_once(s,
              "export const IDLE = {mediaId: null, mediaType: null};\n\n",
              "export const IDLE = {mediaId: null, mediaType: null};\n\n"
              "const localMediaId = (value) => {\n\tconst id = String(value == null ? '' : value).trim();\n\treturn id || null;\n};\n\n"
              "export const seerrSelectionMediaId = ({tmdbId, jellyfinMediaId} = {}) => {\n\tconst localId = localMediaId(jellyfinMediaId);\n\treturn localId ? {tmdbId, jellyfinMediaId: localId} : tmdbId;\n};\n\n",
              'Seerr local identity helper')
          old = r'''// How a Seerr title reaches the detail screen when the library has nothing to open for it.
          // External rows key some titles by IMDb id alone, so the stub can carry that instead of a
          // TMDB id, along with the title for a search fallback.
          export const seerrDetailStub = ({mediaId, mediaType, imdbId, title}) => ({
          	Id: `seerr-${mediaType}-${mediaId ?? imdbId}`,
          	Type: mediaType === 'tv' ? 'Series' : 'Movie',
          	_seerrMediaId: mediaId ?? null,
          	_seerrMediaType: mediaType,
          	_seerrImdbId: imdbId || null,
          	_seerrTitle: title || null
          });'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = r'''// A known Jellyfin identity opens the real library item; otherwise keep the current
          // Seerr stub, including upstream's IMDb/title fallback for external rows without TMDB ids.
          export const seerrDetailStub = ({mediaId, mediaType, imdbId, title}) => {
          	const structured = mediaId && typeof mediaId === 'object' ? mediaId : null;
          	const jellyfinMediaId = localMediaId(structured?.jellyfinMediaId);
          	const resolvedType = mediaType === 'tv' ? 'Series' : 'Movie';
          	if (jellyfinMediaId) return {Id: jellyfinMediaId, Type: resolvedType};
          	const tmdbId = structured ? structured.tmdbId : mediaId;
          	return {
          		Id: `seerr-${mediaType}-${tmdbId ?? imdbId}`,
          		Type: resolvedType,
          		_seerrMediaId: tmdbId ?? null,
          		_seerrMediaType: mediaType,
          		_seerrImdbId: imdbId || null,
          		_seerrTitle: title || null
          	};
          };'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          s = replace_once(s, old, new, 'Seerr detail stub')
          p.write_text(s)

          p = Path('packages/app/src/utils/seerrTarget.test.js')
          s = p.read_text()
          s = replace_once(s,
              "import {seerrTargetFor, seerrDetailStub, isSeerrOnlyItem, bestSearchMatch} from './seerrTarget';",
              "import {bestSearchMatch, isSeerrOnlyItem, seerrDetailStub, seerrSelectionMediaId, seerrTargetFor} from './seerrTarget';",
              'Seerr test import')
          block = r'''

          describe('Discovery detail selection', () => {
          	it('keeps requestable-only titles on the Seerr detail path', () => {
          		const stub = seerrDetailStub({mediaId: seerrSelectionMediaId({tmdbId: 603}), mediaType: 'movie'});
          		expect(isSeerrOnlyItem(stub)).toBe(true);
          		expect(seerrTargetFor(stub)).toEqual({mediaId: 603, mediaType: 'movie', imdbId: null, title: null});
          	});
          	it('opens owned Discovery titles as real Jellyfin items', () => {
          		const mediaId = seerrSelectionMediaId({tmdbId: 603, jellyfinMediaId: 'jf-movie-1'});
          		expect(seerrDetailStub({mediaId, mediaType: 'movie'})).toEqual({Id: 'jf-movie-1', Type: 'Movie'});
          	});
          	it('ignores blank local identities', () => {
          		const mediaId = seerrSelectionMediaId({tmdbId: 603, jellyfinMediaId: '   '});
          		expect(mediaId).toBe(603);
          	});
          });
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          s = replace_once(s, "\ndescribe('seerrDetailStub', () => {", block + "\ndescribe('seerrDetailStub', () => {", 'Seerr Discovery tests')
          p.write_text(s)

          for path in [
              'packages/app/src/context/SettingsContext.js',
              'packages/app/src/utils/homeLayout.js',
              'packages/app/src/utils/homeLayout.test.js',
              'packages/app/src/utils/seerrTarget.js',
              'packages/app/src/utils/seerrTarget.test.js',
          ]:
              text = Path(path).read_text()
              if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
                  raise RuntimeError(f'{path}: conflict marker survived')
          PY

          git add -- "${expected[@]}"
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            exit 1
          fi
          git diff --check
          git diff --cached --check

      - name: Install dependencies
        run: npm ci

      - name: Conflict-surface and Discovery tests
        run: npm test --workspace=@moonfin/app -- --runInBand packages/app/src/utils/homeLayout.test.js packages/app/src/utils/seerrTarget.test.js packages/app/src/services/homeLabDiscoveryPlanner.test.js packages/app/src/services/homeLabDiscoveryCatalogue.test.js packages/app/src/services/homeLabDiscoveryClient.test.js packages/app/src/services/homeLabDiscoveryComposer.test.js packages/app/src/services/homeLabDiscoveryMembership.test.js packages/app/src/services/homeLabDiscoveryPersonalisation.test.js packages/app/src/services/homeLabDiscoveryRotationStore.test.js packages/app/src/services/homeLabDiscoveryLaneLoader.test.js packages/app/src/services/homeLabDiscoveryLaneLoader.identity.test.js packages/app/src/services/homeLabDiscoveryTabController.test.js packages/app/src/services/homeLabDiscoveryDeepState.test.js packages/app/src/services/homeLabDiscoveryDeepController.test.js packages/app/src/services/homeLabDiscoveryRoute.test.js packages/app/src/services/homeLabDiscoveryQuality.test.js packages/app/src/services/homeLabDiscoveryVisualPolicy.test.js

      - name: Build reviewed webOS 2.8.2 port
        run: npm run build:webos

      - name: Verify exact package identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const appInfo = JSON.parse(fs.readFileSync('packages/build-webos/webos-meta/appinfo.json', 'utf8'));
          if (appInfo.id !== 'org.moonfin.webos') throw new Error(`Unexpected webOS app id: ${appInfo.id}`);
          if (appInfo.version !== '2.8.2') throw new Error(`Unexpected reviewed webOS version: ${appInfo.version}`);
          if (appInfo.main !== 'index.html') throw new Error(`Unexpected webOS entry point: ${appInfo.main}`);
          NODE

      - name: Commit and push isolated update candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo 'Tracked unstaged changes appeared during validation; refusing ambiguous candidate.' >&2
            git status --short
            exit 1
          fi
          git commit -m 'chore(upstream): port Home Lab overlay onto Smart-TV 2.8.2'
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo '# Home Lab webOS 2.8.2 staging result'
            echo
            echo "- reviewed release: \`$EXPECTED_RELEASE_TAG\` / \`$EXPECTED_RELEASE_SHA\`"
            echo "- Home Lab overlay: \`$GITHUB_SHA\`"
            echo "- isolated candidate: \`$candidate_sha\`"
            echo "- target branch: \`$TARGET_BRANCH\`"
            echo '- five reviewed conflicts resolved; focused tests and webOS build passed before push'
            echo '- accepted Home-Lab and rollback branches were not modified'
          } >> "$GITHUB_STEP_SUMMARY"
